services:
  db:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # Valkey provides the Redis-compatible Celery broker and optional app cache.
  valkey:
    image: ghcr.io/valkey-io/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  minio:
    # Source-built community image; official MinIO community images are no longer published.
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SUPPORT_MINIO_ACCESS_KEY:?SUPPORT_MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${SUPPORT_MINIO_SECRET_KEY:?SUPPORT_MINIO_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    restart: always
    networks:
      - monitoring

  milvus-etcd:
    image: milvusdb/etcd:3.5.18-r2
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://milvus-etcd:2379
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - monitoring

  milvus:
    image: milvusdb/milvus:v2.5.26
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${SUPPORT_MINIO_ACCESS_KEY:?SUPPORT_MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_ACCESS_KEY: ${SUPPORT_MINIO_SECRET_KEY:?SUPPORT_MINIO_SECRET_KEY must be set}
      MINIO_BUCKET_NAME: support-milvus
      MINIO_ROOT_PATH: support-rag
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:19091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - monitoring

  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong random value}
      # The .env files say localhost, which is correct for `make dev` but unreachable
      # from inside the container. Point at the compose service instead.
      - POSTGRES_HOST=db
      - SUPPORT_MINIO_ENDPOINT=minio:9000
      - SUPPORT_MILVUS_URI=http://milvus:19530
      - SUPPORT_CELERY_BROKER_URL=redis://valkey:6379/1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  support-worker:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    command: ["/app/.venv/bin/celery", "-A", "app.services.support_tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=db
      - SUPPORT_MINIO_ENDPOINT=minio:9000
      - SUPPORT_MILVUS_URI=http://milvus:19530
      - SUPPORT_CELERY_BROKER_URL=redis://valkey:6379/1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: always


networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
  valkey-data:
  minio-data:
  milvus-etcd-data:
  milvus-data:
